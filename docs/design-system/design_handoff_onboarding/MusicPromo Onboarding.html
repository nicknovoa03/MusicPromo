<!-- @dsCard group="Onboarding" name="Music Promo Onboarding" subtitle="6-step first-run wizard — light theme, black CTA" viewport="460x920" -->
<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MusicPromo — Onboarding</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #FFFFFF 0%, #F4F2EC 55%, #ECE9E1 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px; box-sizing: border-box;
  }
  #root { display: flex; align-items: center; justify-content: center; }
  /* press state — opacity .85 + scale .985, per design system */
  .press { transition: transform 120ms ease, opacity 120ms ease; }
  .press:active { transform: scale(0.985); opacity: 0.85; }
  ion-icon { pointer-events: none; }
  input::placeholder, textarea::placeholder { color: var(--fg-secondary); opacity: 0.85; }
  input:focus, textarea:focus { box-shadow: 0 0 0 1px var(--accent-primary); border-color: var(--accent-primary) !important; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes mp-in-right { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes mp-in-left  { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes mp-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes mp-pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    [style*="animation"] { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>

<script type="text/babel" src="icon.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="share-card.jsx"></script>
<script type="text/babel" src="onboarding-steps.jsx"></script>
<script type="text/babel" src="onboarding-app.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <IOSDevice width={390} height={844} dark={false}>
        <Onboarding />
      </IOSDevice>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
