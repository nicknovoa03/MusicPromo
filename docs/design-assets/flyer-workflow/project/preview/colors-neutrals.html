<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-ui)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{border:1px solid rgba(0,0,0,.08);border-radius:10px;overflow:hidden}
.chip{height:64px}
.meta{padding:8px 10px}
.n{font-size:11px;font-weight:700;letter-spacing:-.01em}
.h{font-size:10px;color:#6B6F7A;font-family:var(--font-mono);margin-top:1px}
.h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#6B6F7A;margin:0 0 10px}
.grp{margin-bottom:14px}
</style></head><body>
<div class="grp"><div class="h2">Light · App chrome</div><div class="row">
<div class="sw"><div class="chip" style="background:#FBFAF7"></div><div class="meta"><div class="n">bg</div><div class="h">#FBFAF7</div></div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid #eee"></div><div class="meta"><div class="n">surface</div><div class="h">#FFFFFF</div></div></div>
<div class="sw"><div class="chip" style="background:#F2F0EA"></div><div class="meta"><div class="n">surface-muted</div><div class="h">#F2F0EA</div></div></div>
<div class="sw"><div class="chip" style="background:#11131A"></div><div class="meta"><div class="n">text</div><div class="h">#11131A</div></div></div>
<div class="sw"><div class="chip" style="background:#6B6F7A"></div><div class="meta"><div class="n">text-secondary</div><div class="h">#6B6F7A</div></div></div>
<div class="sw"><div class="chip" style="background:rgba(17,19,26,.10)"></div><div class="meta"><div class="n">border</div><div class="h">10% ink</div></div></div>
</div></div>
<div class="grp"><div class="h2">Dark · Editorial + system</div><div class="row">
<div class="sw"><div class="chip" style="background:#0E1014"></div><div class="meta"><div class="n">bg</div><div class="h">#0E1014</div></div></div>
<div class="sw"><div class="chip" style="background:#181B22"></div><div class="meta"><div class="n">surface</div><div class="h">#181B22</div></div></div>
<div class="sw"><div class="chip" style="background:#23262F"></div><div class="meta"><div class="n">surface-muted</div><div class="h">#23262F</div></div></div>
<div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid #eee"></div><div class="meta"><div class="n">text</div><div class="h">#FFFFFF</div></div></div>
<div class="sw"><div class="chip" style="background:#0E1014;position:relative"><div style="position:absolute;inset:0;background:rgba(255,255,255,.55)"></div></div><div class="meta"><div class="n">text-secondary</div><div class="h">55% white</div></div></div>
<div class="sw"><div class="chip" style="background:#0E1014;position:relative"><div style="position:absolute;inset:0;background:rgba(255,255,255,.10)"></div></div><div class="meta"><div class="n">border</div><div class="h">10% white</div></div></div>
</div></div>
</body></html>
