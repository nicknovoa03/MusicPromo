<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-ui);color:#11131A}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.h{font-size:10px;color:#6B6F7A;letter-spacing:.16em;text-transform:uppercase;font-weight:700;width:100%;margin-top:6px}
.disabled{opacity:.3}
</style></head><body>
<div class="h">Primary</div>
<div class="row">
  <button class="btn-primary">Next</button>
  <button class="btn-primary"><span style="margin-right:6px">↗</span>Export Carousel</button>
  <button class="btn-primary disabled" disabled>Next</button>
</div>
<div class="h">Fill (capsule, dark on light)</div>
<div class="row">
  <button class="btn-fill">Pick a photo</button>
  <button class="btn-fill">Sign in with Apple</button>
</div>
<div class="h">Pill / Icon</div>
<div class="row">
  <button class="btn-pill">+ Add link</button>
  <button class="icon-button" style="border:1px solid var(--border)">‹</button>
  <button class="icon-button" style="border:1px solid var(--border)">×</button>
</div>
</body></html>
