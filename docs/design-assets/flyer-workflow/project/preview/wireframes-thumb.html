<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:14px;background:#F6F4EE;font-family:Inter,system-ui;color:#11131A}
.h1{font:800 18px/1.1 'Inter Tight',Inter;letter-spacing:-.02em;margin:0 0 4px}
.sub{font-size:11px;color:#6B6F7A;margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.frame{background:#000;border-radius:10px;padding:4px;aspect-ratio:9/19}
.body{width:100%;height:100%;border-radius:7px;background:#0E1014;color:#fff;display:flex;flex-direction:column;font-size:7px;padding:6px;box-sizing:border-box}
.body.light{background:#FBFAF7;color:#11131A}
.lbl{font-size:7px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.6;margin-top:auto;text-align:center}
.t{font-weight:700;font-size:9px;margin-bottom:3px}
.box{border:1px solid currentColor;border-radius:4px;flex:1;margin-bottom:3px;opacity:.4}
.cta{height:10px;border-radius:3px;background:#3A5DFF;color:#fff;font-size:6px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:3px}
.dots{display:flex;justify-content:center;gap:2px;margin:3px 0}
.dots i{width:3px;height:3px;border-radius:99px;background:currentColor;opacity:.3}
.dots i.a{width:7px;opacity:1}
</style></head><body>
<div class="h1">Phase 8 — EPK wireframes</div>
<div class="sub">6 screens · annotated · flow diagram</div>
<div class="thumbs">
  <div class="frame"><div class="body light"><div class="t">New Project</div><div class="box"></div><div class="box"></div><div class="lbl">01 Type</div></div></div>
  <div class="frame"><div class="body"><div class="t">‹ New EPK</div><div class="box" style="flex:2"></div><div class="box" style="max-height:14px"></div><div class="cta">Next</div><div class="lbl">02 Details</div></div></div>
  <div class="frame"><div class="body"><div class="t">‹ Vision</div><div class="box"></div><div class="cta">Next</div><div class="lbl">03 Vision</div></div></div>
  <div class="frame"><div class="body"><div class="t">‹ Preview</div><div class="box" style="flex:3"></div><div class="dots"><i class="a"></i><i></i><i></i><i></i></div><div class="cta">Export</div><div class="lbl">04 Preview</div></div></div>
  <div class="frame"><div class="body"><div class="t">Slides</div><div class="box"></div><div class="box"></div><div class="lbl">05 Slides</div></div></div>
  <div class="frame"><div class="body light"><div class="t">Projects</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1"><div class="box" style="margin:0"></div><div class="box" style="margin:0;position:relative"><div style="position:absolute;top:1px;left:1px;background:#11131A;color:#fff;font-size:5px;padding:0 2px;border-radius:2px">EPK</div></div></div><div class="lbl">06 Badge</div></div></div>
</div>
</body></html>
