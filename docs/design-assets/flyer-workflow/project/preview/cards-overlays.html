<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:18px;background:#FBFAF7;font-family:Inter,system-ui;color:#11131A;display:flex;gap:14px;flex-wrap:wrap}
.card{background:#fff;border:1px solid rgba(17,19,26,.10);border-radius:12px;padding:14px;width:200px}
.card .t{font-weight:700;font-size:13px;margin-bottom:4px}
.card .s{font-size:11px;color:#6B6F7A;line-height:1.5}
.thumb{width:200px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;position:relative;background:#23262F;color:#fff;display:flex;align-items:center;justify-content:center}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.thumb .badge{position:absolute;top:8px;left:8px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;background:#11131A;color:#fff;padding:3px 7px;border-radius:99px;z-index:2}
.thumb .menu{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:99px;background:rgba(14,16,20,.78);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2}
.thumb .title{position:absolute;bottom:8px;left:8px;font-size:12px;font-weight:700;z-index:2}
</style></head><body>
<div class="card">
  <div class="t">Surface card</div>
  <div class="s">Solid surface · hairline border · radius 12. No shadow. Elevation = surface step + border, never glow.</div>
</div>
<div class="thumb">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#23262F 0 8px,#2a2e38 8px 16px)"></div>
  <div class="ov"></div>
  <div class="menu">⋯</div>
  <div class="title">Midnight Drive</div>
</div>
<div class="thumb">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#23262F 0 8px,#2a2e38 8px 16px)"></div>
  <div class="ov"></div>
  <div class="badge">EPK</div>
  <div class="menu">⋯</div>
  <div class="title">Pavement</div>
</div>
</body></html>
