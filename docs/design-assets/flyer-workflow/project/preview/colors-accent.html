<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:18px;background:#fff;font-family:Inter,system-ui}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{border:1px solid rgba(0,0,0,.08);border-radius:10px;overflow:hidden}
.chip{height:72px}
.meta{padding:8px 10px}
.n{font-size:11px;font-weight:700}
.h{font-size:10px;color:#6B6F7A;font-family:ui-monospace,Menlo,monospace;margin-top:1px}
.h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#6B6F7A;margin:0 0 10px}
.note{font-size:11px;color:#6B6F7A;margin-top:10px;line-height:1.5}
</style></head><body>
<div class="h2">Accent · Semantic</div>
<div class="row">
<div class="sw"><div class="chip" style="background:#3A5DFF"></div><div class="meta"><div class="n">accent-primary</div><div class="h">#3A5DFF · CTAs</div></div></div>
<div class="sw"><div class="chip" style="background:rgba(58,93,255,.14)"></div><div class="meta"><div class="n">accent-muted</div><div class="h">14% primary</div></div></div>
<div class="sw"><div class="chip" style="background:#11131A"></div><div class="meta"><div class="n">fill / FAB</div><div class="h">#11131A</div></div></div>
<div class="sw"><div class="chip" style="background:#C62828"></div><div class="meta"><div class="n">destructive</div><div class="h">#C62828 · Delete</div></div></div>
<div class="sw"><div class="chip" style="background:#FF6B6B"></div><div class="meta"><div class="n">warning</div><div class="h">#FF6B6B · counter ≤30</div></div></div>
</div>
<div class="note"><b>Discipline:</b> one accent button per screen. Hierarchy comes from type weight + neutral surface stack, not from hue. No gradients.</div>
</body></html>
