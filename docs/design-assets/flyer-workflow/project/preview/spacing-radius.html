<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:18px;background:#fff;font-family:Inter,system-ui;color:#11131A}
.h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#6B6F7A;margin:0 0 10px}
.row{display:flex;gap:14px;align-items:flex-end;margin-bottom:20px}
.cell{text-align:center;font-size:10.5px;color:#6B6F7A;font-family:ui-monospace,Menlo,monospace}
.swatch{background:#11131A;margin-bottom:6px}
.rad{border:2px solid #11131A;width:60px;height:60px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:10px;color:#11131A;font-family:ui-monospace,Menlo,monospace;font-weight:700}
</style></head><body>
<div class="h2">Spacing scale</div>
<div class="row">
<div class="cell"><div class="swatch" style="width:4px;height:32px"></div>xs · 4</div>
<div class="cell"><div class="swatch" style="width:8px;height:32px"></div>sm · 8</div>
<div class="cell"><div class="swatch" style="width:16px;height:32px"></div>md · 16</div>
<div class="cell"><div class="swatch" style="width:24px;height:32px"></div>lg · 24</div>
<div class="cell"><div class="swatch" style="width:32px;height:32px"></div>xl · 32</div>
<div class="cell"><div class="swatch" style="width:48px;height:32px"></div>xxl · 48</div>
</div>
<div class="h2">Corner radii</div>
<div class="row">
<div class="cell"><div class="rad" style="border-radius:8px">8</div>sm</div>
<div class="cell"><div class="rad" style="border-radius:12px">12</div>md</div>
<div class="cell"><div class="rad" style="border-radius:20px">20</div>lg</div>
<div class="cell"><div class="rad" style="border-radius:36px">36</div>iphone-edge</div>
<div class="cell"><div class="rad" style="border-radius:9999px">∞</div>full</div>
</div>
</body></html>
