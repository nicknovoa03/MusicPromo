<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c3bed",
                        "background-light": "#f7f6f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        .waveform-bg {
            background: linear-gradient(90deg, rgba(124,59,237,0.2) 0%, rgba(124,59,237,1) 50%, rgba(124,59,237,0.2) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-dark text-slate-100 font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto border-x border-slate-800">
<!-- Header -->
<header class="flex items-center justify-between p-4 bg-background-dark/80 backdrop-blur-md z-20">
<button class="flex items-center justify-center text-slate-100 hover:text-primary transition-colors" style="">
<span class="material-symbols-outlined text-2xl" style="">close</span>
</button>
<div class="flex items-center gap-1 cursor-pointer group">
<h2 class="text-sm font-semibold tracking-tight" style=""><br/></h2>
<span class="material-symbols-outlined text-sm group-hover:text-primary transition-colors" style="">expand_more</span>
</div>
<button class="bg-primary hover:bg-primary/90 text-white text-xs font-bold px-4 py-1.5 rounded-full transition-all" style="">
                Export
            </button>
</header>
<!-- Preview Area -->
<main class="relative flex-1 flex flex-col items-center justify-center p-4">
<div class="relative w-full aspect-[9/16] max-h-[70vh] rounded-xl overflow-hidden shadow-2xl bg-slate-900 group">
<!-- Vinyl Album Art Preview -->
<div class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-primary/20 to-black">
<div class="relative w-4/5 aspect-square rounded-full border-4 border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.5)] overflow-hidden">
<img alt="Album Art" class="w-full h-full object-cover" data-alt="Stylized vinyl record album cover art" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCX0pVrqRNQEXag_JopdUvJ58xCNTP3Dw95UxOAgcln6FlYH5oM9HkN7hWlIfGZSKpJlTDQiHGHKRYWWZyvUSx3hEVtLTDy3gxl01HUOMQgO2vuCKY83wRPhCNvdjkIwjrmzaxhq_PccucJWRORd54uy4Xhq7cDEjwAKA7JFvUmME15c9VTzCMXqTzH9cWsG8QagnNSF0lvX7XxBLPRVBcNeD-hip57fvBL9rV5VAoAEckgcsJMPOR3123HyShn9Lscv0dp1ciIsbhV" style=""/>
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-12 h-12 bg-black rounded-full border-2 border-slate-700 flex items-center justify-center">
<div class="w-3 h-3 bg-slate-400 rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Integrated Template Controls Overlay -->
<div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black via-black/80 to-transparent pb-8">
<!-- Color Swatches -->
<div class="flex items-center gap-3 mb-6 overflow-x-auto no-scrollbar py-2">
<div class="size-6 rounded-full bg-primary border-2 border-white ring-2 ring-primary/30 shrink-0"></div>
<div class="size-6 rounded-full bg-blue-500 border-2 border-transparent shrink-0"></div>
<div class="size-6 rounded-full bg-emerald-500 border-2 border-transparent shrink-0"></div>
<div class="size-6 rounded-full bg-amber-500 border-2 border-transparent shrink-0"></div>
<div class="size-6 rounded-full bg-rose-500 border-2 border-transparent shrink-0"></div>
<div class="size-6 rounded-full bg-slate-700 border-2 border-transparent shrink-0"></div>
<div class="size-6 rounded-full bg-slate-800 border-2 border-slate-700 shrink-0 flex items-center justify-center cursor-pointer hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[14px] text-slate-400">colorize</span>
</div>
<div class="size-6 rounded-full bg-slate-800 border-2 border-slate-700 shrink-0 flex items-center justify-center cursor-pointer hover:border-primary transition-colors">
<span class="material-symbols-outlined text-[16px] text-slate-400">add</span>
</div></div>
<!-- Sliders -->
<div class="space-y-4">
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center text-[10px] uppercase tracking-widest font-bold text-slate-400">
<span class="" style="">Opacity</span>
<span class="text-primary" style="">80%</span>
</div>
<div class="relative h-1.5 w-full bg-slate-800 rounded-full">
<div class="absolute inset-y-0 left-0 w-4/5 bg-primary rounded-full"></div>
<div class="absolute top-1/2 left-[80%] -translate-x-1/2 -translate-y-1/2 size-3.5 bg-white rounded-full shadow-lg border-2 border-primary"></div>
</div>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center text-[10px] uppercase tracking-widest font-bold text-slate-400">
<span class="" style="">Spin Speed</span>
<span class="text-primary" style="">50%</span>
</div>
<div class="relative h-1.5 w-full bg-slate-800 rounded-full">
<div class="absolute inset-y-0 left-0 w-1/2 bg-primary rounded-full"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 size-3.5 bg-white rounded-full shadow-lg border-2 border-primary"></div>
</div>
</div>
</div>
</div>
<!-- Play Overlay -->
<div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
<div class="size-16 rounded-full bg-black/40 backdrop-blur-sm border border-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-4xl fill-1" style="">play_arrow</span>
</div>
</div>
</div>
</main>
<!-- Timeline/Tools Section -->
<!-- Bottom Tab Nav -->
<nav class="flex border-t border-slate-800 bg-background-dark/90 backdrop-blur-md px-6 py-4 justify-between items-center shrink-0">
<a class="text-primary flex flex-col items-center gap-1" href="#" style="">
<span class="material-symbols-outlined text-2xl fill-1" style="">music_note</span>
</a>
<a class="text-slate-500 hover:text-primary flex flex-col items-center gap-1 transition-colors" href="#" style="">
<span class="material-symbols-outlined text-2xl" style="">auto_fix_high</span>
</a>
<a class="text-slate-500 hover:text-primary flex flex-col items-center gap-1 transition-colors" href="#" style="">
<span class="material-symbols-outlined text-2xl" style="">text_fields</span>
</a>
<a class="text-slate-500 hover:text-primary flex flex-col items-center gap-1 transition-colors" href="#" style="">
<span class="material-symbols-outlined text-2xl" style="">grid_view</span>
</a>
<a class="text-slate-500 hover:text-primary flex flex-col items-center gap-1 transition-colors" href="#" style="">
<span class="material-symbols-outlined text-2xl" style="">settings</span>
</a>
</nav>
</div>
</body></html>
